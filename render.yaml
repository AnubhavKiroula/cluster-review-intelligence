# Render blueprint for the Python API (cri.server). The Next.js site in web/ is
# static and deploys separately on Vercel; see docs/DEPLOYMENT.md.
#
# The API powers only the explorer's "Try your own review". Everything else on the
# site works without it.
services:
  - type: web
    name: cri-api
    runtime: python
    plan: free
    region: singapore # closest free region to India; change if unavailable
    buildCommand: pip install ".[api]"
    startCommand: uvicorn cri.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # numpy==1.26.2 has no Python 3.13 wheels.
      - key: PYTHON_VERSION
        value: "3.12.10"
      # Browser origins allowed to call the API (comma-separated).
      - key: CRI_API_CORS_ORIGINS
        value: https://cluster-review-intelligence.vercel.app

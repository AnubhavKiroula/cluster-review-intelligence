# SYNTHETIC / ASSUMED values for the travel layer (CLAUDE.md rule 2).
#
# Nothing in this file was measured. It holds the illustrative profiles that make the
# demo work end to end: destination season curves and tags, stays for the SYNTHETIC
# Properties A-L, local sellers, prices and the demand-index weights. Every number the
# app derives from this file is shown with basis "synthetic" or "assumption".
# Verifiable facts (coordinates, holidays, distances, emission factors) live in
# travel_facts.yaml instead. The loader refuses this file without the label below.
label: SYNTHETIC

# --- Demand index weights (points; see docs/AI_MODEL.md) -------------------------------
demand:
  prior_points: {high: 30, medium: 20, low: 10}   # destination popularity tier
  season_max: 25        # season[month] (0..1) x 25
  weekend: 10
  holiday: 10           # gazetted holiday (travel_facts.yaml)
  long_weekend: 15      # day inside a run of >= 3 off-days containing a holiday
  window: 10            # inside an assumed school-vacation or year-end window
  categories:           # upper bounds (exclusive); the last one is open-ended
    - [30, Low]
    - [55, Moderate]
    - [75, High]
    - [101, Very High]
  borderline: 3         # within +-3 points of a category cut -> "borderline"
  quieter_min_drop: 10  # a shifted trip must be >= 10 points quieter on average
  quieter_window: 7     # shift the trip by up to +-7 days

# Assumed travel windows (not facts): school dates differ by state and board.
windows:
  - {name: "School summer vacation (assumed)", start: 2026-05-11, end: 2026-06-30,
     note: "Delhi Directorate of Education 2026 dates as reported in the press; other states and boards differ"}
  - {name: "School summer vacation (assumed)", start: 2027-05-11, end: 2027-06-30,
     note: "2027 dates are not published; assumed to repeat 2026"}
  - {name: "School winter break (assumed)", start: 2027-01-01, end: 2027-01-15,
     note: "Pattern of the Delhi 2025-26 school calendar; 2026-27 dates not published"}
  - {name: "Year-end holidays (assumed)", start: 2026-12-24, end: 2027-01-01,
     note: "Christmas to New Year travel peak; an assumption, not an official holiday"}
  - {name: "Year-end holidays (assumed)", start: 2027-12-24, end: 2027-12-31,
     note: "Christmas to New Year travel peak; an assumption, not an official holiday"}


# Aspect taxonomy for the rule/lexicon baseline.
# Cue terms are lowercase and matched against NORMALISED review text
# (see cri.normalize). Terms include English, Hindi (Devanagari), and
# romanised Hinglish variants so mixed-language reviews are covered.
#
# This file is config: extend the cue lists to improve recall without touching
# code. Keep terms reasonably distinct across aspects.


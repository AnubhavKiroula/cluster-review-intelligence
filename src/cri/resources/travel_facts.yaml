# Verifiable facts for the travel layer. NOTHING in this file is synthetic.
#
# Every value was read from the cited document on 2026-10-13. If a fact cannot be
# sourced it does not belong here: illustrative values live in travel_synthetic.yaml.
# Validated on load by cri.travel.data (every `source` key must exist below, and
# every holiday's weekday must match its date).

sources:
  wikidata:
    title: "Wikidata (CC0): coordinates (P625) and elevation (P2044)"
    url: "https://www.wikidata.org/"
  holidays_2026_uk:
    title: >-
      Gazetted holidays 2026 for Central Government offices in Uttarakhand, CGEWCC Dehradun,
      as per DoPT O.M. F.No.12/2/2023-JCA dated 03.07.2025
    url: "https://surveyofindia.gov.in/UserFiles/files/List%20of%20Holidays-2026%20(2).pdf"
  holidays_2027:
    title: >-
      DoPT O.M. F.No.12/2/2023-JCA dated 16.07.2026, Annexure-I (holidays 2027), forwarded by
      the Department of Posts on 08.09.2026; the CGEWCC Dehradun list for Uttarakhand is identical
    url: "https://utilities.cept.gov.in/dop/pdfbind.ashx?id=15435"
  hptdc:
    title: "HPTDC (Himachal Pradesh Tourism Development Corporation), Access: important distances"
    url: "https://hptdc.hp.gov.in/index.php/access"
  nainital_nic:
    title: "District Nainital (NIC), How to reach Nainital by road"
    url: "https://nainital.nic.in/how-to-reach-nainital-by-road/"
  dehradun_nic:
    title: "District Dehradun (NIC), Mussoorie"
    url: "https://dehradun.nic.in/tourist-place/mussoorie/"
  utdb_2021_2023:
    title: "Uttarakhand Tourism Development Board, Tourists Statistics of Major Tourist Destinations 2021-2023"
    url: "https://uttarakhandtourism.gov.in/assets/pdf/Statistic21-23.pdf"
  desnz_2026:
    title: >-
      UK DESNZ Greenhouse gas reporting: conversion factors 2026, flat file (revised July 2026),
      Open Government Licence v3.0
    url: "https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026"
  indiaghg_road:
    title: "India GHG Program, India Specific Road Transport Emission Factors (2015), Table: four wheelers"
    url: "https://indiaghgp.org/sites/default/files/Road%20Transport%20Technical%20Paper.pdf"


  - {from: delhi,      to: kasauli,    km: 325, source: hptdc}
  - {from: chandigarh, to: shimla,     km: 117, source: hptdc}
  - {from: chandigarh, to: manali,     km: 320, source: hptdc}
  - {from: chandigarh, to: mcleodganj, km: 252, source: hptdc, note: "HPTDC lists Chandigarh - Dharamshala"}
  - {from: chandigarh, to: dalhousie,  km: 318, source: hptdc}
  - {from: chandigarh, to: kasauli,    km: 65,  source: hptdc}
  - {from: delhi,      to: nainital,   km: 310, source: nainital_nic}
  - {from: dehradun,   to: nainital,   km: 300, source: nainital_nic}

# Official annual tourist arrivals (Indian + foreign). UTDB has no separate rows for
# Dhanaulti, Kanatal, Chakrata or Lansdowne; Himachal publishes no destination series.
arrivals:
  - {place: mussoorie, year: 2023, total: 1471913, source: utdb_2021_2023}
  - {place: nainital,  year: 2023, total: 784497,  source: utdb_2021_2023}
  - {place: kausani,   year: 2023, total: 82563,   source: utdb_2021_2023, note: "UTDB row 'Kausani & Bageshwar' (combined)"}

# Emission factors. `per` says what one unit is: a vehicle-km is shared by everyone in
# the car; a passenger-km is per traveller.
emission_factors:
  car:
    value: 0.130
    unit: kg CO2
    per: vehicle-km
    source: indiaghg_road
    note: "Petrol hatchback under 1400 cc (the paper also gives 0.140 with a 10% uplift); hill driving likely emits more"
  bus:
    value: 0.03948
    unit: kg CO2e
    per: passenger-km
    source: desnz_2026
    note: "UK coach factor (Business travel - land, Bus, Coach); no Indian intercity bus factor was found"

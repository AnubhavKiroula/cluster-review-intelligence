name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Pinned by commit SHA (verified via the GitHub API against the tagged release).
      - name: Harden the runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # The api extra lets tests/test_server.py exercise the HTTP API (TestClient).
      - name: Install (dev + api extras)
        run: python -m pip install -e ".[dev,api]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest)
        run: python -m pytest

  # The Next.js frontend (web/) is the only UI: it must type-check and build.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned by commit SHA (verified via the GitHub API against the v7.1.0 release tag).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build (static export)
        run: npm run build

  # Deployment config (docs/DEPLOYMENT.md): the API image must build and answer /health,
  # and the Cloudflare Worker in front of it must type-check.
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the API image
        run: docker build --platform linux/amd64 -t cri-api .

      - name: Smoke-test the API image
        run: |
          docker run -d --name cri-api -p 8080:8080 \
            -e CRI_API_CORS_ORIGINS=http://localhost:3000 cri-api
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs cri-api
          exit 1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/cloudflare/api/package-lock.json

      - name: Type-check the Cloudflare Worker
        working-directory: deploy/cloudflare/api
        run: |
          npm ci
          npm run check

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # These must move together: pandas 2.1 cannot import on numpy 2, and scipy /
    # scikit-learn wheels track numpy. One PR, one CI run.
    groups:
      dataframe-stack:
        patterns: ["numpy", "pandas", "scipy", "scikit-learn"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "web"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

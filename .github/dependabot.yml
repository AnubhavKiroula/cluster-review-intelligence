version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # These must move together: pandas 2.1 cannot import on numpy 2, streamlit
    # 1.41 requires pandas<3, and pyarrow 26 requires numpy>=2. One PR, one CI run.
    groups:
      dataframe-stack:
        patterns: ["numpy", "pandas", "pyarrow", "streamlit"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

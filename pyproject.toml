[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-review-intelligence"
version = "0.1.0"
description = "Cluster-level review analytics and competitive benchmarking for Uttarakhand tourism (synthetic MVP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "cluster-review-intelligence contributors" }]
keywords = ["tourism", "reviews", "nlp", "benchmarking", "hinglish", "uttarakhand"]

# Pinned for reproducibility (see CLAUDE.md). Bumped via Dependabot PRs.
dependencies = [
    "numpy==1.26.2",
    "pandas==2.1.3",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
figures = ["matplotlib==3.10.8"]
dev = [
    "pytest==9.0.3",
    "ruff==0.16.10",
    "matplotlib==3.10.8",
]

[project.scripts]
cri-generate = "cri.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cri = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, comprehensions, pyupgrade
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cri"]
